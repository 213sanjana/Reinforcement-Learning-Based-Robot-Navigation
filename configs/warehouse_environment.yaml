# Geometric candidates for the existing worlds. Listing a pair does not mean it
# was driven. Clearance is unverified unless a live report says otherwise.
namespace: j100_0000
lidar_topic: /j100_0000/sensors/lidar3d_0/scan
odom_topic: /j100_0000/platform/odom
command_topic: /j100_0000/platform/cmd_vel_unstamped
contact_topic: /jackal_rl/obstacle_contacts
odom_frame: odom
base_frame: base_link
lidar_frame: lidar3d_0_laser
goal_tolerance_m: 0.30
max_episode_steps: 600
sensor_timeout_s: 5.0
control_frequency_hz: 5.0
min_separation_m: 0.50
robot_radius_m: 0.25
stationary_linear_limit_mps: 0.02
stationary_angular_limit_radps: 0.05
require_listed_pair: true
active_stage: external_warehouse
stages:
  open:
    world_file: jackal_rl_ws/worlds/demo/jackal_demo_open.sdf
    world_name: jackal_demo_open
    gazebo_partition: jackal_rl
    require_listed_pair: true
    scenarios:
      - {id: open_train_short, split: train, start: [0.0, 0.0, 0.0], goal: [0.75, 0.0]}
      - {id: open_val_mid, split: validation, start: [0.0, 0.0, 0.0], goal: [2.0, 0.0]}
      - {id: open_test_demo, split: test, start: [0.0, 0.0, 0.0], goal: [4.0, 0.0]}
  original_warehouse:
    world_file: jackal_rl_ws/worlds/demo/jackal_navigation_world.sdf
    world_name: jackal_navigation_world
    require_listed_pair: true
    scenarios:
      - {id: warehouse_train_center, split: train, start: [0.0, 0.0, 0.0], goal: [2.0, 0.0]}
      - {id: warehouse_val_goal_marker, split: validation, start: [0.0, 0.0, 0.0], goal: [4.0, 0.0]}
      - {id: warehouse_test_offset, split: test, start: [1.0, 0.0, 0.0], goal: [4.0, 0.0]}
  external_warehouse:
    world_file: jackal_rl_ws/worlds/external_warehouse/jackal_industrial_warehouse.sdf
    world_name: industrial-warehouse
    gazebo_partition: jackal_rl_external
    require_listed_pair: true
    scenarios:
      - {id: ext_train_east, split: train, start: [0.0, 0.0, 0.0], goal: [1.5, 0.0]}
      - {id: ext_train_aisle, split: train, start: [1.5, 0.0, 0.0], goal: [2.0, -2.0]}
      - {id: ext_train_south, split: train, start: [0.0, 0.0, 0.0], goal: [0.0, -3.0]}
      - {id: ext_val_marker, split: validation, start: [2.0, -2.0, 0.0], goal: [0.0, -3.0]}
      - {id: ext_val_west, split: validation, start: [0.0, -3.0, 0.0], goal: [-2.0, 0.0]}
      - {id: ext_test_cross, split: test, start: [1.5, 0.0, 0.0], goal: [0.0, -3.0]}
      - {id: ext_test_long, split: test, start: [2.0, -2.0, 0.0], goal: [-2.0, 0.0]}
      - {id: ext_test_return, split: test, start: [0.0, -3.0, 0.0], goal: [1.5, 0.0]}
  generalization:
    world_file: jackal_rl_ws/worlds/external_warehouse/jackal_industrial_warehouse.sdf
    world_name: industrial-warehouse
    gazebo_partition: jackal_rl_external
    require_listed_pair: true
    scenarios:
      - {id: gen_test_cross, split: test, start: [1.5, 0.0, 0.0], goal: [0.0, -3.0]}
      - {id: gen_test_long, split: test, start: [2.0, -2.0, 0.0], goal: [-2.0, 0.0]}
      - {id: gen_test_return, split: test, start: [0.0, -3.0, 0.0], goal: [1.5, 0.0]}
  house:
    world_file: jackal_rl_ws/worlds/house/jackal_house.sdf
    world_name: jackal_house
    gazebo_partition: jackal_rl
    require_listed_pair: true
    scenarios:
      - {id: house_train_east, split: train, start: [0.0, 0.0, 0.0], goal: [2.0, -3.0]}
      - {id: house_train_west, split: train, start: [0.0, 0.0, 0.0], goal: [-2.0, -3.0]}
      - {id: house_val_far, split: validation, start: [0.0, 0.0, 0.0], goal: [0.0, -7.0]}
      - {id: house_test_return, split: test, start: [0.0, -7.0, 0.0], goal: [0.0, 0.0]}
  ground:
    world_file: jackal_rl_ws/worlds/ground/jackal_ground.sdf
    world_name: jackal_ground
    gazebo_partition: jackal_rl
    require_listed_pair: true
    scenarios:
      - {id: ground_train_near, split: train, start: [0.0, 0.0, 0.0], goal: [2.0, 0.0]}
      - {id: ground_train_mid, split: train, start: [0.0, 0.0, 0.0], goal: [4.2, 0.6]}
      - {id: ground_val_far, split: validation, start: [0.0, 0.0, 0.0], goal: [6.5, 0.2]}
      - {id: ground_test_return, split: test, start: [6.5, 0.2, 0.0], goal: [0.0, 0.0]}
