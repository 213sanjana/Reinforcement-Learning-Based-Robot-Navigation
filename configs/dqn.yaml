environment:
  height: 10
  width: 10
  obstacle_density: 0.18
  max_steps: 150
agent:
  learning_rate: 0.0001
  gamma: 0.99
  batch_size: 64
  replay_capacity: 50000
  warmup_steps: 2000
  train_frequency: 4
  target_update_frequency: 1000
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 150000
  hidden_size: 256
  double_dqn: false
  bootstrap_on_truncation: true
  gradient_clip: 10.0
training:
  total_steps: 200000
  seed: 2027
  device: auto
  log_interval: 10000
  checkpoint: artifacts/dqn_model.pt
  metrics: artifacts/dqn_metrics.csv
  figure: artifacts/dqn_training.png
evaluation:
  seed: 90211
  episodes: 100
  device: auto
  results: artifacts/dqn_evaluation.json
  route_plot: artifacts/dqn_route.png
