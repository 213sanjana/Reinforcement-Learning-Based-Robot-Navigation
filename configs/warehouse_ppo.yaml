# Warehouse PPO. execution: gazebo is the intended robot run and is refused
# unless a separate motion authorization is supplied on the command line.
execution: gazebo
stage_id: external_warehouse
split: train
reward_config: configs/warehouse_reward.yaml
environment_config: configs/warehouse_environment.yaml
curriculum_config: configs/warehouse_curriculum.yaml
ppo:
  policy: MlpPolicy
  learning_rate: 0.0003
  n_steps: 1024
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  normalize_observations: false
  device: auto
  seed: 42
  total_timesteps: 10240
  checkpoint_interval: 2048
  n_envs: 1
  min_episodes_for_best: 5
